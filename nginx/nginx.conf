upstream memora_api {
    server api:8000;
}

upstream memora_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://memora_api;
    }

    location /health {
        proxy_pass http://memora_api;
    }

    location /docs {
        proxy_pass http://memora_api;
    }

    location /openapi.json {
        proxy_pass http://memora_api;
    }

    # Telegram delivers bot updates here (SPEC §7). Not under /api/v1.
    location /telegram/ {
        proxy_pass http://memora_api;
    }

    location / {
        proxy_pass http://memora_web;
    }
}
