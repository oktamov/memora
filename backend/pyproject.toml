[project]
name = "memora"
version = "0.1.0"
description = "Memora — Telegram Mini App for vocabulary learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "httpx>=0.27,<0.28",
    "aiogram>=3.15,<4",
    "fsrs>=4.1,<5",
    "uuid6>=2024.7.10",
    "pyjwt>=2.10,<3",
    "apscheduler>=3.10,<4",
    "python-json-logger>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]
ignore = [
    "B008",     # FastAPI Depends() in argument defaults is the framework idiom
    "RUF001",   # IPA transcriptions are full of "ambiguous" Unicode on purpose
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fsrs.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine and its asyncpg pool are
# process-wide, and a per-test loop would strand pooled connections on a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
