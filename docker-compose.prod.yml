# Production stack.
#
# Deliberately publishes NO host ports: the server already runs another project whose
# Caddy owns 80/443 and whose API owns 8000. Memora is reached only through that Caddy
# over the shared `memora_edge` network, so the two projects cannot collide.
#
# Self-contained on purpose — it is used with `-f docker-compose.prod.yml` alone rather
# than layered over docker-compose.yml, because Compose merges `ports` lists by
# appending, which would silently reintroduce the dev port bindings.

name: memora

services:
  db:
    image: postgres:16-alpine
    container_name: memora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: memora
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: memora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  api:
    build:
      context: ./backend
    container_name: memora-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://memora:${POSTGRES_PASSWORD}@db:5432/memora
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
             --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal, edge]

  web:
    build:
      context: ./frontend
    container_name: memora-web
    restart: unless-stopped
    depends_on: [api]
    networks: [edge]

volumes:
  db_data:

networks:
  internal:
  # Shared with the server's existing Caddy. Created by deploy/deploy.sh.
  edge:
    name: memora_edge
    external: true
