server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points at the hashed bundle, and a
    # stale copy pins users to a bundle that no longer exists after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
